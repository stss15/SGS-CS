<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Fetch Decode Execute architecture flow</title>
  <desc id="desc">Simplified data flow between memory, control unit, ALU and key registers during one instruction cycle.</desc>
  <defs>
    <style>
      .box { fill: #f7fbff; stroke: #1f3f73; stroke-width: 2; }
      .reg { fill: #edf3ff; stroke: #355d9c; stroke-width: 1.8; }
      .arrow { stroke: #1f3f73; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
      .label { font-family: "Source Sans 3", Arial, sans-serif; fill: #132846; font-size: 18px; font-weight: 700; }
      .sub { font-family: "Source Sans 3", Arial, sans-serif; fill: #28456f; font-size: 14px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f3f73" />
    </marker>
  </defs>

  <rect class="box" x="40" y="80" width="190" height="210" rx="14" />
  <text class="label" x="98" y="116">Memory</text>
  <text class="sub" x="64" y="145">Instructions + data</text>

  <rect class="box" x="330" y="44" width="260" height="128" rx="14" />
  <text class="label" x="406" y="82">Control Unit</text>
  <text class="sub" x="386" y="111">Decode + control signals</text>

  <rect class="box" x="330" y="210" width="260" height="128" rx="14" />
  <text class="label" x="432" y="249">ALU</text>
  <text class="sub" x="378" y="278">Arithmetic + logic operations</text>

  <rect class="reg" x="670" y="54" width="240" height="64" rx="11" />
  <text class="label" x="748" y="92">PC / MAR</text>

  <rect class="reg" x="670" y="140" width="240" height="64" rx="11" />
  <text class="label" x="748" y="178">MDR / CIR</text>

  <rect class="reg" x="670" y="226" width="240" height="64" rx="11" />
  <text class="label" x="772" y="264">ACC</text>

  <path class="arrow" d="M230 130 C275 130, 292 92, 330 92" />
  <path class="arrow" d="M590 92 C624 92, 640 86, 670 86" />
  <path class="arrow" d="M790 118 L790 140" />
  <path class="arrow" d="M790 204 L790 226" />
  <path class="arrow" d="M670 258 C636 258, 620 270, 590 270" />
  <path class="arrow" d="M330 270 C274 270, 252 218, 230 205" />

  <text class="sub" x="252" y="118">Address/data bus</text>
  <text class="sub" x="612" y="85">Instruction flow</text>
  <text class="sub" x="808" y="133">Fetch</text>
  <text class="sub" x="810" y="218">Execute</text>
  <text class="sub" x="614" y="255">ALU result</text>
</svg>
