<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniPhone OS - Data Detective</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="sim-shell">
        <a class="sim-back-link" href="/ks3/year7/unit2/activity2.html">
            <i class="fa-solid fa-arrow-left"></i>
            Back to instructions
        </a>

        <div class="phone-container">
            <div class="phone-frame">
                <div class="phone-screen">
                    <div class="dynamic-notch" aria-hidden="true"></div>
                    <div class="status-bar" id="status-bar">
                        <span class="status-time" id="status-time">15:00</span>
                        <span class="status-icons" aria-hidden="true">
                            <i class="fa-solid fa-signal"></i>
                            <i class="fa-solid fa-wifi"></i>
                        </span>
                    </div>

                    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

                    <!-- Home Screen -->
                    <div class="screen home-screen active" id="home-screen" role="application" aria-label="Home screen">
                        <div class="app-grid">
                            <button class="app-icon" type="button" data-app="messages">
                                <div class="app-icon-img messages-icon">
                                    <i class="fa-solid fa-message"></i>
                                    <span class="notification-badge" id="messages-badge">1</span>
                                </div>
                                <span class="app-label">Messages</span>
                            </button>

                            <button class="app-icon locked" type="button" data-app="browser">
                                <div class="app-icon-img browser-icon">
                                    <i class="fa-solid fa-compass"></i>
                                </div>
                                <span class="app-label">Browser</span>
                            </button>

                            <button class="app-icon locked" type="button" data-app="connectify">
                                <div class="app-icon-img connectify-icon">
                                    <i class="fa-solid fa-heart"></i>
                                </div>
                                <span class="app-label">Connectify</span>
                            </button>

                            <button class="app-icon locked" type="button" data-app="mapme">
                                <div class="app-icon-img mapme-icon">
                                    <i class="fa-solid fa-map-location-dot"></i>
                                </div>
                                <span class="app-label">MapMe</span>
                            </button>

                            <button class="app-icon locked" type="button" data-app="freegame">
                                <div class="app-icon-img freegame-icon">
                                    <i class="fa-solid fa-gamepad"></i>
                                </div>
                                <span class="app-label">Super Puzzle</span>
                            </button>

                            <button class="app-icon" type="button" data-app="casefile">
                                <div class="app-icon-img casefile-icon">
                                    <i class="fa-solid fa-folder-open"></i>
                                    <span class="notification-dot" id="casefile-dot" aria-hidden="true"></span>
                                </div>
                                <span class="app-label">Case File</span>
                            </button>

                            <button class="app-icon" type="button" data-app="settings">
                                <div class="app-icon-img settings-icon">
                                    <i class="fa-solid fa-gear"></i>
                                </div>
                                <span class="app-label">Settings</span>
                            </button>
                        </div>

                        <div class="home-indicator" aria-hidden="true"></div>
                    </div>

                    <!-- Messages -->
                    <div class="screen app-screen" id="screen-messages" aria-label="Messages">
                        <div class="app-header messages-header">
                            <button class="back-btn" type="button" data-action="home">
                                <i class="fa-solid fa-chevron-left"></i> Back
                            </button>
                            <h3>Messages</h3>
                            <div class="header-spacer"></div>
                        </div>
                        <div class="app-body">
                            <div class="messages-container" id="messages-container"></div>
                        </div>
                    </div>

                    <!-- Browser -->
                    <div class="screen app-screen" id="screen-browser" aria-label="Browser">
                        <div class="app-header browser-header">
                            <button class="back-btn" type="button" data-action="home">
                                <i class="fa-solid fa-chevron-left"></i> Back
                            </button>
                            <h3>Browser</h3>
                            <div class="header-spacer"></div>
                        </div>
                        <div class="app-body" id="browser-body"></div>
                        <div class="cookie-banner" id="cookie-banner" aria-label="Cookie banner" aria-live="polite"></div>
                    </div>

                    <!-- Connectify -->
                    <div class="screen app-screen" id="screen-connectify" aria-label="Connectify">
                        <div class="app-header connectify-header">
                            <button class="back-btn" type="button" data-action="home">
                                <i class="fa-solid fa-chevron-left"></i> Back
                            </button>
                            <h3>Connectify</h3>
                            <div class="header-spacer"></div>
                        </div>
                        <div class="app-body" id="connectify-body"></div>
                    </div>

                    <!-- MapMe -->
                    <div class="screen app-screen" id="screen-mapme" aria-label="MapMe">
                        <div class="app-header mapme-header">
                            <button class="back-btn" type="button" data-action="home">
                                <i class="fa-solid fa-chevron-left"></i> Back
                            </button>
                            <h3>MapMe</h3>
                            <div class="header-spacer"></div>
                        </div>
                        <div class="app-body" id="mapme-body"></div>
                    </div>

                    <!-- Super Puzzle Quest -->
                    <div class="screen app-screen" id="screen-freegame" aria-label="Super Puzzle Quest">
                        <div class="app-header freegame-header">
                            <button class="back-btn" type="button" data-action="home">
                                <i class="fa-solid fa-chevron-left"></i> Back
                            </button>
                            <h3>Super Puzzle Quest</h3>
                            <div class="header-spacer"></div>
                        </div>
                        <div class="app-body" id="freegame-body"></div>
                    </div>

                    <!-- Case File -->
                    <div class="screen app-screen" id="screen-casefile" aria-label="Case File">
                        <div class="app-header casefile-header">
                            <button class="back-btn" type="button" data-action="home">
                                <i class="fa-solid fa-chevron-left"></i> Back
                            </button>
                            <h3>Case File</h3>
                            <div class="header-spacer"></div>
                        </div>
                        <div class="app-body" id="casefile-body"></div>
                    </div>

                    <!-- Settings -->
                    <div class="screen app-screen" id="screen-settings" aria-label="Settings">
                        <div class="app-header settings-header">
                            <button class="back-btn" type="button" data-action="home">
                                <i class="fa-solid fa-chevron-left"></i> Back
                            </button>
                            <h3>Settings</h3>
                            <div class="header-spacer"></div>
                        </div>
                        <div class="app-body" id="settings-body"></div>
                    </div>

                    <!-- Permission Dialog -->
                    <div class="permission-overlay" id="permission-overlay" hidden>
                        <div class="permission-dialog" role="dialog" aria-modal="true" aria-label="Permission prompt">
                            <div class="permission-icon" id="permission-icon" aria-hidden="true"></div>
                            <h4 id="permission-title"></h4>
                            <p id="permission-desc"></p>
                            <div class="permission-buttons" id="permission-buttons"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js" defer></script>
</body>

</html>
