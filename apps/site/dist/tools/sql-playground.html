  (() => {
    const toggle = document.querySelector('.site-mobile-toggle');
    const drawer = document.getElementById('site-mobile-drawer');
    if (!toggle || !drawer) return;

    const open = () => {
      drawer.hidden = false;
      requestAnimationFrame(() => {
        drawer.classList.add('open');
        toggle.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
      });
    };

    const close = () => {
      drawer.classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
      drawer.addEventListener('transitionend', () => {
        if (!drawer.classList.contains('open')) drawer.hidden = true;
      }, { once: true });
    };

    toggle.addEventListener('click', () => drawer.hidden ? open() : close());
    drawer.querySelectorAll('[data-close-drawer]').forEach(el => el.addEventListener('click', close));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !drawer.hidden) close(); });
  })();

      (() => {
        const collapseBtn = document.getElementById('sidebar-collapse-btn');
        const expandBtn = document.getElementById('sidebar-expand-btn');
        const shell = document.querySelector('.page-shell--with-sidebar');
        if (!collapseBtn || !expandBtn || !shell) return;

        const STORAGE_KEY = 'sgs-sidebar-collapsed';
        const isCollapsed = localStorage.getItem(STORAGE_KEY) === '1';
        if (isCollapsed) shell.classList.add('page-shell--sidebar-collapsed');

        collapseBtn.addEventListener('click', () => {
          shell.classList.add('page-shell--sidebar-collapsed');
          localStorage.setItem(STORAGE_KEY, '1');
        });
        expandBtn.addEventListener('click', () => {
          shell.classList.remove('page-shell--sidebar-collapsed');
          localStorage.setItem(STORAGE_KEY, '0');
        });
      })();
    </script>
