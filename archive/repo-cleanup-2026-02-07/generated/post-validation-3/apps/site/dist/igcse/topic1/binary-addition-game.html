<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Addition Quest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/game-binary-addition.css">
    <link rel="stylesheet" href="/css/standalone-nav.css">


    <!-- data-sgs-auth-gate -->
    <link rel="stylesheet" href="/css/auth-gate.css">
    <script>document.documentElement.classList.add('auth-pending');</script>
    <meta name="description" content="SGS Science resources for KS3, IGCSE, and IB Computer Science students and teachers.">
</head><body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="standalone-nav" aria-label="Standalone navigation">
        <a class="standalone-nav__link" href="index.html">← Back</a>
        <a class="standalone-nav__link standalone-nav__link--home" href="/index.html">🏠 Home</a>
    </div>
    <div class="container">
        <header>
            <a href="index.html" style="text-decoration: none; color: #00f5ff; font-size: 1.5rem; margin-right: 20px;">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1>⚡ Binary Addition Quest</h1>
            <div class="global-timer" id="global-timer">2:00</div>
        </header>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">Level</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Streak</div>
                <div class="stat-value" id="streak">0🔥</div>
            </div>
        </div>

        <div class="game-area">
            <div class="problem-info">
                <div class="streak-badge" id="multiplier">1x Multiplier</div>

                <div class="bonus-timer-container">
                    <div class="bonus-label">
                        <span>Bonus Time</span>
                        <span id="bonus-time-text">30s</span>
                    </div>
                    <div class="bonus-bar-bg">
                        <div class="bonus-bar-fill" id="bonus-bar"></div>
                    </div>
                </div>
            </div>

            <div class="binary-display">
                <div class="column-index" id="col-index"></div>

                <div class="binary-row">
                    <span class="row-label">A</span>
                    <div id="num-a" class="bits-container"></div>
                </div>

                <div class="binary-row">
                    <span class="plus-sign">+</span>
                    <span class="row-label">B</span>
                    <div id="num-b" class="bits-container"></div>
                </div>

                <div class="separator"></div>

                <div class="binary-row">
                    <span class="row-label">Q</span>
                    <div id="output-row" class="bits-container"></div>
                </div>

                <div class="binary-row carry-row">
                    <span class="row-label carry-label">C</span>
                    <div id="carry-row" class="bits-container"></div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="check-btn" data-sgs-onclick="checkAnswer()">Check Answer</button>
            </div>

            <div class="message" id="message"></div>
        </div>
    </div>

    <div class="level-up-overlay" id="level-up-overlay">
        <div class="level-up-text">🎉 GAME OVER 🎉</div>
        <div class="level-up-sub" id="level-up-sub"></div>
        <button class="btn btn-primary" style="margin-top: 30px" data-sgs-onclick="resetGame()">Play Again</button>
    </div>

    <script src="/js/game-binary-addition.js"></script>

    <!-- data-sgs-auth-gate -->
    <script src="/__/firebase/10.13.2/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.13.2/firebase-auth-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
    <script src="/js/auth-gate.js"></script>

    <!-- data-sgs-inline-events -->
    <script src="/js/legacy-inline-events.js"></script>
</body></html>
