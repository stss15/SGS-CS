<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Core: V22 (Chaos Edition)</title>
    
    <link rel="stylesheet" href="/css/game-igcse-topic4-software.css">

    <!-- data-sgs-auth-gate -->
    <link rel="stylesheet" href="/css/auth-gate.css">
    <script>document.documentElement.classList.add('auth-pending');</script>
    <meta name="description" content="SGS Science resources for KS3, IGCSE, and IB Computer Science students and teachers.">
</head>

<body>

    <div id="rotate-msg">Please Rotate Device ⟳</div>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI -->
    <div id="ui-layer">
        <div id="score-box" class="hud-text">0</div>
        <div id="lives-box" class="hud-text">❤❤❤</div>
        <div id="wave-box" class="hud-text">WAVE 1</div>
        <div id="timer-box" class="hud-text">20</div>
        <div id="progress-box" class="hud-text">POOL: 65 LEFT</div>

        <!-- Powerup UI -->
        <div id="powerup-bar-container">
            <div id="powerup-text">WEAPON LEVEL 1</div>
            <div id="powerup-bar"></div>
        </div>

        <div id="stick-left" class="joystick-zone">
            <div class="joystick-knob"></div>
        </div>
        <div id="stick-right" class="joystick-zone">
            <div class="joystick-knob"></div>
        </div>

        <!-- Mobile Controls (Top Right) -->
        <div id="mobile-controls" class="mobile-controls">
            <button class="mobile-btn" data-sgs-onclick="togglePause()">II</button>
            <button class="mobile-btn" data-sgs-onclick="exitGame()">X</button>
        </div>
    </div>

    <!-- START MENU -->
    <div id="start-screen" class="screen">
        <h1>System Core</h1>
        <p>Topic 4: Software (V22 Chaos)</p>
        <div>
            <button class="btn" data-sgs-onclick="initGame('PC')">PC MODE</button>
            <button class="btn" data-sgs-onclick="initGame('MOBILE')">MOBILE MODE</button>
            <button class="btn" data-sgs-onclick="exitGame()">EXIT</button>
        </div>
        <p style="margin-top:20px; font-size:0.9rem;">Press ESC to Pause</p>
    </div>

    <!-- PAUSE MENU -->
    <div id="pause-screen" class="screen">
        <h1>PAUSED</h1>
        <button class="btn" data-sgs-onclick="togglePause()">RESUME</button>
        <button class="btn" data-sgs-onclick="exitGame()">EXIT TO HUB</button>
    </div>

    <!-- QUIZ MODAL -->
    <div id="quiz-screen" class="screen">
        <div id="quiz-box">
            <h2 id="quiz-title" style="color:#00f3ff; margin-top:0;">SECURITY CHECK</h2>
            <p id="q-text" style="color:#fff; font-size:1.2rem; margin-bottom:20px;">Question...</p>
            <div id="q-opts"></div>
        </div>
    </div>

    <!-- GAME OVER / VICTORY -->
    <div id="game-over" class="screen" style="display: none;">
        <h1 id="go-title" style="color:#ff0055;">CRITICAL ERROR</h1>
        <p id="final-score" style="font-size: 1.5rem; color: #fff;">SCORE: 0</p>
        <p id="high-score" style="font-size: 1.5rem; color: #ffe600;">SESSION BEST: 0</p>

        <!-- Revision Tool -->
        <div id="revision-container">
            <h3 style="color:#fff; margin-top:0;">MISTAKES LOG:</h3>
            <div id="revision-list"></div>
        </div>

        <button class="btn" data-sgs-onclick="location.reload()">REBOOT SYSTEM</button>
        <button class="btn" data-sgs-onclick="exitGame()">EXIT</button>
    </div>

    
    <script src="/js/game-igcse-topic4-software.js"></script>

    <!-- data-sgs-auth-gate -->
    <script src="/__/firebase/10.13.2/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.13.2/firebase-auth-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
    <script src="/js/auth-gate.js"></script>

    <!-- data-sgs-inline-events -->
    <script src="/js/legacy-inline-events.js"></script>
</body>

</html>
