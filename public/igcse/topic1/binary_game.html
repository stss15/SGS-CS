<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bit Stacker - Binary Conversion Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/game-binary-stacker.css">
    <link rel="stylesheet" href="/css/standalone-nav.css">


    <!-- data-sgs-auth-gate -->
    <link rel="stylesheet" href="/css/auth-gate.css">
    <script>document.documentElement.classList.add('auth-pending');</script>
    <meta name="description" content="SGS Education resources for KS3, IGCSE, and IB students and teachers.">
</head>

<body>
    <div class="standalone-nav" aria-label="Standalone navigation">
        <a class="standalone-nav__link" href="index.html">← Back</a>
        <a class="standalone-nav__link standalone-nav__link--home" href="/index.html">🏠 Home</a>
    </div>

    <div class="game-container">
        <!-- Game Area -->
        <div class="game-area">
            <!-- Header -->
            <div class="header-row">
                <div class="col-header">128</div>
                <div class="col-header">64</div>
                <div class="col-header">32</div>
                <div class="col-header">16</div>
                <div class="col-header">8</div>
                <div class="col-header">4</div>
                <div class="col-header">2</div>
                <div class="col-header">1</div>
                <div class="target-header">TARGET</div>
            </div>

            <!-- Grid -->
            <div class="grid-layer" id="gridLayer">
                <div class="danger-line"></div>
                <!-- Rows will be injected here -->
            </div>

            <!-- Footer -->
            <div class="footer-row">
                <div class="col-header">128</div>
                <div class="col-header">64</div>
                <div class="col-header">32</div>
                <div class="col-header">16</div>
                <div class="col-header">8</div>
                <div class="col-header">4</div>
                <div class="col-header">2</div>
                <div class="col-header">1</div>
                <div class="target-header">TARGET</div>
            </div>

            <!-- Start Screen -->
            <div id="startScreen" class="overlay">
                <div class="title"><span class="keyword" data-def="the basic computing element that is either 0 or 1, and is formed from the words Binary digit">BIT</span> <span>STACKER</span></div>
                <p style="color: var(--text-muted); margin-bottom: 40px;">Binary Conversion Challenge</p>
                <button class="btn btn-primary" style="width: 200px;" data-sgs-onclick="game.start()">
                    <i class="fa-solid fa-play"></i> START MISSION
                </button>
                <button class="btn btn-secondary" style="width: 200px;" data-sgs-onclick="window.location.href='index.html'">
                    <i class="fa-solid fa-arrow-left"></i> RETURN
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="gameOverScreen" class="overlay hidden">
                <h1 style="color: var(--red); font-size: 4rem; margin-bottom: 10px;">SYSTEM FAILURE</h1>
                <p style="color: var(--red); opacity: 0.7; letter-spacing: 2px; margin-bottom: 40px;">STACK OVERFLOW
                    DETECTED</p>

                <div style="display: flex; gap: 20px; margin-bottom: 40px;">
                    <div class="stat-box" style="text-align: center; width: 150px;">
                        <div class="stat-label">Final Score</div>
                        <div class="stat-value" id="finalScore">0</div>
                    </div>
                    <div class="stat-box" style="text-align: center; width: 150px;">
                        <div class="stat-label">Level</div>
                        <div class="stat-value" id="finalLevel">1</div>
                    </div>
                </div>

                <div style="display: flex; gap: 20px;">
                    <button class="btn btn-primary" style="width: 180px;" data-sgs-onclick="game.start()">
                        <i class="fa-solid fa-rotate-right"></i> REBOOT
                    </button>
                    <button class="btn btn-secondary" style="width: 180px;" data-sgs-onclick="window.location.href='index.html'">
                        <i class="fa-solid fa-xmark"></i> ABORT
                    </button>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="hud-sidebar">
            <div style="flex: 1;">
                <div class="stat-label" style="margin-bottom: 20px;">Mission Status</div>

                <div class="stat-box">
                    <div class="stat-label" style="color: var(--cyan);">Score</div>
                    <div class="stat-value" id="scoreDisplay">000000</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label" style="color: var(--green);">Level</div>
                    <div class="stat-value" id="levelDisplay">1</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label" style="color: #a855f7;">Spawn Rate</div>
                    <div class="stat-value" style="font-size: 1.2rem;" id="rateDisplay">8.0s</div>
                </div>
            </div>

            <div style="border-top: 1px solid var(--border); padding-top: 20px;">
                <button class="btn btn-secondary" data-sgs-onclick="game.togglePause()">
                    <i class="fa-solid fa-pause"></i> <span id="pauseText">PAUSE</span>
                </button>
                <button class="btn btn-secondary" data-sgs-onclick="game.toggleAudio()">
                    <i class="fa-solid fa-volume-high" id="audioIcon"></i> AUDIO
                </button>
                <button class="btn btn-danger" data-sgs-onclick="game.gameOver()">
                    <i class="fa-solid fa-power-off"></i> TERMINATE
                </button>
            </div>
        </div>
    </div>

    <!-- Numpad (Dynamic) -->
    <div id="numpad" class="numpad-overlay hidden">
        <button class="num-btn" data-sgs-onclick="game.handleInput('7')">7</button>
        <button class="num-btn" data-sgs-onclick="game.handleInput('8')">8</button>
        <button class="num-btn" data-sgs-onclick="game.handleInput('9')">9</button>
        <button class="num-btn" data-sgs-onclick="game.handleInput('4')">4</button>
        <button class="num-btn" data-sgs-onclick="game.handleInput('5')">5</button>
        <button class="num-btn" data-sgs-onclick="game.handleInput('6')">6</button>
        <button class="num-btn" data-sgs-onclick="game.handleInput('1')">1</button>
        <button class="num-btn" data-sgs-onclick="game.handleInput('2')">2</button>
        <button class="num-btn" data-sgs-onclick="game.handleInput('3')">3</button>
        <button class="num-btn" style="color: var(--red);" data-sgs-onclick="game.closeNumpad()"><i
                class="fa-solid fa-xmark"></i></button>
        <button class="num-btn" data-sgs-onclick="game.handleInput('0')">0</button>
        <button class="num-btn check" data-sgs-onclick="game.handleInput('CHECK')"><i class="fa-solid fa-check"></i></button>
        <button class="num-btn del" data-sgs-onclick="game.handleInput('DEL')">Backspace</button>
    </div>

    <script src="/js/game-binary-stacker.js"></script>

    <!-- data-sgs-auth-gate -->
    <script src="/__/firebase/10.13.2/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.13.2/firebase-auth-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
    <script src="/js/auth-gate.js"></script>

    <!-- data-sgs-inline-events -->
    <script src="/js/legacy-inline-events.js"></script>
</body>

</html>
