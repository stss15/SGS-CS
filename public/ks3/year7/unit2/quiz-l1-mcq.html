<body>
    <header class="quiz-header">
        <a href="/ks3/year7/unit2.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Unit</a>
        <h1><i class="fa-solid fa-list-check"></i> Lesson 1 Quiz: Digital You</h1>
        <p>Digital Identity & Digital Footprints</p>
    </header>

    <div class="quiz-container">
        <div class="progress-text">Question <span id="currentQ">0</span> of 15 answered</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div id="questionsContainer"></div>
        <div class="submit-section">

                <i class="fa-solid fa-paper-plane"></i> Submit & Get PDF
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="nameModal">
        <div class="modal">
            <h2>Enter Your Name</h2>
            <p>Enter your full name to generate your results PDF.</p>
            <input type="text" id="nameInput" placeholder="Full Name" maxlength="50">
            <button class="modal-btn" onclick="finishAndGenerate()">Generate Report</button>
        </div>
    </div>

    <script>
        const questions = [
            // All 15 questions focused on Lesson 1: Digital You / Digital Footprints
            // Answer distribution: A=4, B=4, C=4, D=3
            { q: "What is a 'Digital Footprint'?", options: ["The trail of data you leave behind when using the internet", "A secure password used for banking", "A scan of your fingerprint for unlocking phones", "The carbon emissions from your computer"], correct: 0 },
            { q: "Which of these is an example of PRIVATE data?", options: ["Your username in a game", "A public comment on a video", "Your home address and postcode", "Your high score on a leaderboard"], correct: 2 },
            { q: "What is the difference between PASSIVE and ACTIVE digital footprints?", options: ["Passive is what you post, Active is what you read", "Active is what you intentionally post, Passive is data collected about you without you knowing", "There is no difference", "Passive is only for old computers"], correct: 1 },
            { q: "What is a 'Digital Citizen'?", options: ["Someone who knows how to hack computers", "A person who owns more than 3 digital devices", "A citizen of a virtual reality world", "Someone who uses technology safely, responsibly and respectfully"], correct: 3 },
            { q: "Which of these is Personal Identifiable Information (PII)?", options: ["Your full name and date of birth", "Your favourite colour", "Your high score in a game", "A picture of a cat"], correct: 0 },
            { q: "True or False: Deleting a photo from social media removes it permanently from the internet.", options: ["True, it disappears instantly from all servers", "False, it may still exist on servers or screenshotted by others", "True, but only if you delete it within 1 hour", "False, but only the police can see it"], correct: 1 },
            { q: "How long can a digital footprint last?", options: ["24 hours", "Until you delete the app", "Potentially forever", "1 year"], correct: 2 },
            { q: "What is a major risk of sharing your full date of birth online?", options: ["People might send you too many birthday cards", "It takes up too much storage space", "Your friends might forget it", "It can be used by criminals for identity theft"], correct: 3 },
            { q: "Who might look at your digital footprint in the future?", options: ["Universities and employers", "Aliens", "Nobody cares", "Your future pets"], correct: 0 },
            { q: "What should you do before posting a photo of a friend?", options: ["Edit it so they look funny", "Ask for their permission first", "Tag everyone you know", "Print it out"], correct: 1 },
            { q: "Why is a strong password important?", options: ["It looks cool", "It is easier to remember", "It protects your personal data from being stolen", "It makes your internet faster"], correct: 2 },
            { q: "Can you fully erase a digital footprint?", options: ["Yes, delete history and it's gone for good", "Yes, by smashing your device", "No, but you can hide it with a VPN", "No, it is extremely difficult as data is copied to servers and backups"], correct: 3 },
            { q: "Is it safe to share your password with your best friend?", options: ["No, never share your password with anyone", "Yes, if you trust them", "Yes, just for one day", "Only if it's for a game"], correct: 0 },
            { q: "Who can see your digital footprint?", options: ["Only your friends", "Potentially anyone (companies, employers, strangers)", "Only people you allow", "It is invisible"], correct: 1 },
            { q: "What is 'Metadata' in a photo?", options: ["The colours in the image", "The caption you write", "Hidden data like location, time, and camera model", "The filter you use"], correct: 2 }
        ];

        let answers = new Array(questions.length).fill(null);

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = questions.map((q, i) => `
                <div class="question-card" id="qcard-${i}">
                    <span class="question-number">Question ${i + 1}</span>
                    <div class="question-text">${q.q}</div>
                    <div class="options">
                        ${q.options.map((opt, j) => `
                            <div class="option" onclick="selectOption(${i}, ${j})">
                                <span class="option-letter">${String.fromCharCode(65 + j)}</span>
                                <span class="option-text">${opt}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function selectOption(qIndex, optIndex) {
            answers[qIndex] = optIndex;
            const options = document.querySelectorAll(`#qcard-${qIndex} .option`);
            options.forEach((opt, i) => { opt.classList.remove('selected'); if (i === optIndex) opt.classList.add('selected'); });
            updateProgress();
        }

        function updateProgress() {
            const answered = answers.filter(a => a !== null).length;
            document.getElementById('currentQ').textContent = answered;
            document.getElementById('progressFill').style.width = `${(answered / questions.length) * 100}%`;
            document.getElementById('submitBtn').disabled = answered < questions.length;
        }

        function askForName() {
            document.getElementById('nameModal').classList.add('active');
            document.getElementById('nameInput').focus();
            document.getElementById('nameInput').onkeydown = (e) => { if (e.key === 'Enter') finishAndGenerate(); }
        }

        async function finishAndGenerate() {
            const name = document.getElementById('nameInput').value.trim() || "Student";
            document.getElementById('nameModal').classList.remove('active');

            let score = 0;
            const mistakes = [];
            questions.forEach((q, i) => {
                if (answers[i] === q.correct) { score++; }
                else { mistakes.push({ q: q.q, yours: q.options[answers[i]], correct: q.options[q.correct] }); }
            });

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const pageWidth = doc.internal.pageSize.getWidth();
            const margin = 20;
            let y = 20;

            doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.setTextColor(0, 51, 102);
            doc.text("Lesson 1 Quiz Results: Digital You", margin, y); y += 10;

            doc.setFontSize(12); doc.setTextColor(50);
            doc.text(`Name: ${name}`, margin, y);
            doc.text(`Date: ${new Date().toLocaleDateString()}`, margin + 80, y); y += 15;

            doc.setFillColor(score > 10 ? 220 : 255, score > 10 ? 255 : 220, score > 10 ? 220 : 220);
            doc.roundedRect(margin, y, pageWidth - (margin * 2), 25, 3, 3, 'F');
            doc.setFontSize(14); doc.text(`Score: ${score} / ${questions.length}`, margin + 10, y + 10);

            let feedback = score >= 13 ? "Excellent work! You have a strong understanding." : score >= 10 ? "Good job! Review the topics you missed." : "Keep practicing. Read through Lesson 1 again.";
            doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.text(feedback, margin + 10, y + 18); y += 35;

            if (mistakes.length > 0) {
                doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(0);
                doc.text("Areas for Improvement:", margin, y); y += 10;
                mistakes.forEach((m, idx) => {
                    if (y > 270) { doc.addPage(); y = 20; }
                    doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(50);
                    const qLines = doc.splitTextToSize(`${idx + 1}. ${m.q}`, pageWidth - margin * 2);
                    doc.text(qLines, margin, y); y += (qLines.length * 5) + 2;
                    doc.setFont("helvetica", "normal"); doc.setTextColor(200, 0, 0);
                    doc.text(`Your Answer: ${m.yours}`, margin + 5, y); y += 5;
                    doc.setTextColor(0, 150, 0); doc.text(`Correct Answer: ${m.correct}`, margin + 5, y); y += 10;
                });
            } else { doc.setFont("helvetica", "italic"); doc.text("Perfect score! No incorrect answers.", margin, y); }

            doc.save(`SGS_L1_Quiz_${name.replace(/ /g, '_')}.pdf`);

            document.querySelector('.quiz-container').innerHTML = `
                <div style="text-align:center; padding: 4rem 1rem;">
                    <i class="fa-solid fa-file-circle-check" style="font-size: 4rem; color: var(--correct); margin-bottom: 2rem;"></i>
                    <h2>Assessment Submitted!</h2>
                    <p style="margin: 1rem 0 2rem; color: var(--text-light); font-size: 1.1rem;">Your results PDF has been downloaded.</p>
                    <a href="/ks3/year7/unit2.html" class="submit-btn" style="text-decoration:none; display:inline-block;">Return to Unit</a>
                </div>
            `;
        }

        renderQuestions();
    </script>
