<body>
    <header class="quiz-header">

        <h1><i class="fa-solid fa-list-check"></i> Lesson 3 Quiz: What Will People Think?</h1>
        <p>Online Behaviour, Netiquette & Digital Reputation</p>
    </header>

    <div class="quiz-container">
        <div class="progress-text">Question <span id="currentQ">0</span> of 15 answered</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="submit-section">
            <button type="button" class="submit-btn" id="submitBtn" disabled data-sgs-onclick="askForName()">
                <i class="fa-solid fa-paper-plane"></i> Submit & Get PDF
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="nameModal">
        <div class="modal">
            <h2>Enter Your Name</h2>
            <p>Enter your full name to generate your results PDF.</p>
            <input type="text" id="nameInput" placeholder="Full Name" maxlength="50">
            <button type="button" class="modal-btn" data-sgs-onclick="finishAndGenerate()">Generate Report</button>
        </div>
    </div>

    <script>
        const questions = [
            // All 15 questions focused on Lesson 3: Online Behaviour, Netiquette & Digital Reputation
            // Answer distribution: A=4, B=4, C=4, D=3
            { q: "What is 'Netiquette'?", options: ["Etiquette (good manners) for the internet", "A type of fishing net", "A social media for tennis players", "A virus protection software"], correct: 0 },
            { q: "What is 'Context Collapse'?", options: ["When your browser crashes", "When different groups of people (friends, family, teachers) all see the same post", "When you lose your internet connection", "When you delete your account"], correct: 1 },
            { q: "Why do we behave differently on different platforms?", options: ["We don't, everyone acts the same everywhere", "Because the internet changes our personality", "Because different spaces have different audiences and norms", "Because we are all fake online"], correct: 2 },
            { q: "What is the 'Online Disinhibition Effect'?", options: ["When the internet disconnects", "When you get addicted to a game", "When you forget your password", "When people say or do things online they wouldn't do face-to-face because they feel safer/anonymous"], correct: 3 },
            { q: "In which situation is staying anonymous (using a nickname) usually a GOOD idea?", options: ["When asking for advice on a sensitive personal problem", "When bullying someone", "When submitting homework to your teacher", "When applying for a job"], correct: 0 },
            { q: "Why is tone hard to read in text messages?", options: ["The font is too small", "It lacks voice, facial expressions and body language", "People type too fast", "Emojis are confusing"], correct: 1 },
            { q: "Which behaviour is classified as 'Not OK Online'?", options: ["Using a nickname in a game", "Sharing a funny meme with friends", "Posting mean or threatening comments (Trolling)", "Liking a friend's photo"], correct: 2 },
            { q: "True or False: Cyberbullying is less harmful than face-to-face bullying.", options: ["True, because it's just words on a screen", "True, you can just turn off the computer", "False, but only if they know where you live", "False, it can be 24/7 and reach a huge audience instantly"], correct: 3 },
            { q: "What is 'Catfishing'?", options: ["Creating a fake online identity to trick someone", "Catching a fish with a cat", "A type of online game", "Feeding your cat whilst online"], correct: 0 },
            { q: "What is the best way to deal with a 'Troll'?", options: ["Argue with them for hours", "Don't feed the troll (ignore and block them)", "Send them angry emails", "Find out where they live"], correct: 1 },
            { q: "What should you do if you see someone being bullied online?", options: ["Join in for fun", "Share it with everyone", "Report it and support the victim", "Ignore it completely"], correct: 2 },
            { q: "How does your online persona affect your real life?", options: ["It only matters if you are famous", "It makes you taller", "It doesn't, they are separate worlds", "A bad digital reputation can affect friendships, school and future jobs"], correct: 3 },
            { q: "Why are screenshots a risk to privacy?", options: ["Someone can save your 'private' message and share it with others", "They use up storage", "They are blurry", "They make your phone hot"], correct: 0 },
            { q: "You used your real name on LinkedIn but a nickname on Discord. This is an example of:", options: ["Lying", "Adapting your digital identity for different contexts", "Identity theft", "Hiding from the police"], correct: 1 },
            { q: "Which of these is a positive online behaviour?", options: ["Spreading rumours", "Sharing your password", "Reporting dangerous content or bullying", "Using all caps to shout"], correct: 2 }
        ];

        let answers = new Array(questions.length).fill(null);

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = questions.map((q, i) => `
                <div class="question-card" id="qcard-${i}">
                    <span class="question-number">Question ${i + 1}</span>
                    <div class="question-text">${q.q}</div>
                    <div class="options">
                        ${q.options.map((opt, j) => `
                            <div class="option" data-sgs-onclick="selectOption(${i}, ${j})">
                                <span class="option-letter">${String.fromCharCode(65 + j)}</span>
                                <span class="option-text">${opt}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function selectOption(qIndex, optIndex) {
            answers[qIndex] = optIndex;
            const options = document.querySelectorAll(`#qcard-${qIndex} .option`);
            options.forEach((opt, i) => { opt.classList.remove('selected'); if (i === optIndex) opt.classList.add('selected'); });
            updateProgress();
        }

        function updateProgress() {
            const answered = answers.filter(a => a !== null).length;
            document.getElementById('currentQ').textContent = answered;
            document.getElementById('progressFill').style.width = `${(answered / questions.length) * 100}%`;
            document.getElementById('submitBtn').disabled = answered < questions.length;
        }

        function askForName() {
            document.getElementById('nameModal').classList.add('active');
            document.getElementById('nameInput').focus();
            document.getElementById('nameInput').onkeydown = (e) => { if (e.key === 'Enter') finishAndGenerate(); }
        }

        async function finishAndGenerate() {
            const name = document.getElementById('nameInput').value.trim() || "Student";
            document.getElementById('nameModal').classList.remove('active');

            let score = 0;
            const mistakes = [];
            questions.forEach((q, i) => {
                if (answers[i] === q.correct) { score++; }
                else { mistakes.push({ q: q.q, yours: q.options[answers[i]], correct: q.options[q.correct] }); }
            });

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const pageWidth = doc.internal.pageSize.getWidth();
            const margin = 20;
            let y = 20;

            doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.setTextColor(0, 51, 102);
            doc.text("Lesson 3 Quiz Results: Online Behaviour", margin, y); y += 10;

            doc.setFontSize(12); doc.setTextColor(50);
            doc.text(`Name: ${name}`, margin, y);
            doc.text(`Date: ${new Date().toLocaleDateString()}`, margin + 80, y); y += 15;

            doc.setFillColor(score > 10 ? 220 : 255, score > 10 ? 255 : 220, score > 10 ? 220 : 220);
            doc.roundedRect(margin, y, pageWidth - (margin * 2), 25, 3, 3, 'F');
            doc.setFontSize(14); doc.text(`Score: ${score} / ${questions.length}`, margin + 10, y + 10);

            let feedback = score >= 13 ? "Excellent work! You have a strong understanding." : score >= 10 ? "Good job! Review the topics you missed." : "Keep practicing. Read through Lesson 3 again.";
            doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.text(feedback, margin + 10, y + 18); y += 35;

            if (mistakes.length > 0) {
                doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(0);
                doc.text("Areas for Improvement:", margin, y); y += 10;
                mistakes.forEach((m, idx) => {
                    if (y > 270) { doc.addPage(); y = 20; }
                    doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(50);
                    const qLines = doc.splitTextToSize(`${idx + 1}. ${m.q}`, pageWidth - margin * 2);
                    doc.text(qLines, margin, y); y += (qLines.length * 5) + 2;
                    doc.setFont("helvetica", "normal"); doc.setTextColor(200, 0, 0);
                    doc.text(`Your Answer: ${m.yours}`, margin + 5, y); y += 5;
                    doc.setTextColor(0, 150, 0); doc.text(`Correct Answer: ${m.correct}`, margin + 5, y); y += 10;
                });
            } else { doc.setFont("helvetica", "italic"); doc.text("Perfect score! No incorrect answers.", margin, y); }

            doc.save(`SGS_L3_Quiz_${name.replace(/ /g, '_')}.pdf`);

            document.querySelector('.quiz-container').innerHTML = `
                <div style="text-align:center; padding: 4rem 1rem;">
                    <i class="fa-solid fa-file-circle-check" style="font-size: 4rem; color: var(--correct); margin-bottom: 2rem;"></i>
                    <h2>Assessment Submitted!</h2>
                    <p style="margin: 1rem 0 2rem; color: var(--text-light); font-size: 1.1rem;">Your results PDF has been downloaded.</p>
                    <a href="../unit2.html" class="submit-btn" style="text-decoration:none; display:inline-block;">Return to Unit</a>
                </div>
            `;
        }

        renderQuestions();
    </script>
